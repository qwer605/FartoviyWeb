<article>
  <a class="image-link" [routerLink]="['/product', product().id]" [attr.aria-label]="product().name | t">
    <img [src]="product().image" [alt]="product().name | t" loading="lazy" width="400" height="480">
    <span class="view-arrow" aria-hidden="true">↗</span>
  </a>
  <div class="product-meta">
  <h2><a [routerLink]="['/product', product().id]">{{ product().name | t }}</a></h2>
  <p>{{ store.money(product().price) }}</p>
  </div>
</article>
