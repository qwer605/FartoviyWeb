name: FE pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [quality, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test application logic
        run: npm test

      - name: Build FE
        run: npm run build -- --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Test admin, orders, catalog persistence and browser recognition
        run: npm run test:e2e

      - name: Save failed browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy FE
        id: deployment
        uses: actions/deploy-pages@v4
