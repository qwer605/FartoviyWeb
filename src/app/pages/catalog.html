<h1>{{ 'Каталог' | t }}</h1>
<p>{{ 'Товаров:' | t }} {{ store.products.length }}</p>
<section class="products" [attr.aria-label]="'Список товаров' | t">
  @for (product of store.products; track product.id) {
    <shop-product-card [product]="product" />
  } @empty {
    <p>{{ 'В каталоге пока нет товаров.' | t }}</p>
  }
</section>
