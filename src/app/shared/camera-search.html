<button class="camera-button" type="button" (click)="open()" [disabled]="busy()"
  [attr.aria-label]="'Поиск по фото' | t" [title]="'Поиск по фото' | t" [attr.aria-busy]="busy()">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    <path d="M8 5 9.5 3h5L16 5h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" />
    <circle cx="12" cy="12.5" r="4" />
  </svg>
</button>
<input #captureInput type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden
  [disabled]="busy()" (change)="selectFile($event)">
@if (busy()) { <button class="cancel" type="button" (click)="cancel()">{{ 'Отменить поиск' | t }}</button> }
@if (status()) { <span class="feedback" role="status" aria-live="polite">{{ status() | t }}</span> }
@if (error()) { <span class="feedback error" role="alert">{{ error() | t }}</span> }
